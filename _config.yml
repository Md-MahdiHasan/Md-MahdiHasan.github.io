# =========================
# Md. Mahdi Hasan
# =========================

# Site Settings
title: "Md. Mahdi Hasan"
name: "Md. Mahdi Hasan"
description: "AI/ML Researcher | Computer Vision | Deep Learning | Edge AI"
url: "https://YOURUSERNAME.github.io"
baseurl: ""

# Author
author:
  name: "Md. Mahdi Hasan"
  avatar: ""
  bio: "AI/ML Researcher and Lab Instructor working on Deep Learning, Computer Vision, Efficient AI, and Edge AI."
  location: "Dhaka, Bangladesh"
  email: "mahdi.hasan01@northsouth.edu"
  
# Social / Academic Profiles
github: YOUR_GITHUB_USERNAME
linkedin: YOUR_LINKEDIN_USERNAME
google_scholar: YOUR_GOOGLE_SCHOLAR_ID

# Research Interests
research_interests:
  - Deep Learning
  - Computer Vision
  - Visual Representation Learning
  - Efficient and Multi-Modal AI
  - Attention-Based Deep Learning
  - Object Detection
  - Image Understanding
  - Image Forensics
  - Explainable and Robust AI
  - Resource-Efficient AI
  - Edge AI
  - Real-Time Intelligent Systems
  - UAV-Based Precision Agriculture


# =========================
# Build Settings
# =========================

markdown: kramdown
highlighter: rouge

permalink: /:categories/:title/

timezone: Asia/Dhaka

# =========================
# Plugins
# =========================

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from
  - jemoji


# =========================
# Pagination
# =========================

paginate: 5
paginate_path: /page:num/


# =========================
# Archives
# =========================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# =========================
# Collections
# =========================

collections:
  publications:
    output: true
    permalink: /publications/:path/

  projects:
    output: true
    permalink: /projects/:path/

  teaching:
    output: true
    permalink: /teaching/:path/


# =========================
# Defaults
# =========================

defaults:

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  # Projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true


# =========================
# HTML Compression
# =========================

compress_html:
  clippings: all
  ignore:
    envs: development


# =========================
# Exclude from Build
# =========================

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.sh"
  - "*.py"
  - "*.ipynb"
